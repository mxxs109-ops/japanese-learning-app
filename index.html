<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 Daily</title>
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1f1f1f;
    --muted: #8a8780;
    --line: #e7e4de;
    --accent: #3d5afe;
    --accent-soft: #eef0ff;
    --ok: #1f9d6b;
    --ok-soft: #e6f6ef;
    --bad: #d6455d;
    --bad-soft: #fcebee;
    --n5: #497ebe;
    --n4: #d57567;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1d1d1d; --ink: #ececec; --muted: #8f8f8f; --line: #2c2c2c;
      --accent: #7b8cff; --accent-soft: #23263a;
      --ok: #4cc493; --ok-soft: #17291f; --bad: #f0748a; --bad-soft: #321b20;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Microsoft YaHei UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 64px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .date { color: var(--muted); font-size: 13px; }
  .hdr-r { display: flex; align-items: center; gap: 10px; }
  .upd-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 12px;
             padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .upd-btn[disabled] { opacity: .5; cursor: default; }
  .upd-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  ruby.src rt { font-style: italic; color: var(--accent); letter-spacing: 0; }
  .upd-msg { text-align: center; font-size: 13px; color: var(--muted); margin: -8px 0 16px; }
  .upd-card { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border-radius: 14px;
              padding: 14px 16px; margin-bottom: 16px; }
  .upd-card .t { flex: 1; font-size: 14px; line-height: 1.6; }
  .upd-card .t small { display: block; color: var(--muted); font-size: 12px; }

  nav { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line);
        border-radius: 999px; padding: 4px; margin-bottom: 22px; }
  nav button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit;
               font-size: 14px; padding: 9px 0; border-radius: 999px; cursor: pointer; }
  nav button.on { background: var(--ink); color: var(--bg); }
  nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
               font-size: 11px; line-height: 18px; background: var(--bad); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .card + .card { margin-top: 14px; }

  /* 首页 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; font-weight: 700; }
  .stat small { color: var(--muted); font-size: 12px; }
  .hero { text-align: center; padding: 34px 24px; }
  .hero h2 { margin: 0 0 6px; font-size: 20px; }
  .hero p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .btn { border: 0; font: inherit; cursor: pointer; border-radius: 999px; padding: 13px 28px; font-size: 15px;
         background: var(--ink); color: var(--bg); transition: transform .1s, opacity .15s; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 7px 14px; font-size: 13px; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .rule { color: var(--muted); font-size: 13px; line-height: 1.8; }
  .rule b { color: var(--ink); font-weight: 600; }
  .foot { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

  /* 答题 */
  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .lv { font-weight: 800; font-size: 13px; color: #fff; padding: 3px 9px; border-radius: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px;
          font-weight: 600; padding: 6px 15px; border-radius: 999px; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip.on.N5 { background: var(--n5); border-color: var(--n5); color: #fff; }
  .chip.on.N4 { background: var(--n4); border-color: var(--n4); color: #fff; }
  .chip.on.N3 { background: #856ea5; border-color: #856ea5; color: #fff; }
  .chip.on.N2 { background: #e68329; border-color: #e68329; color: #fff; }
  .chip.on.N1 { background: #5dae98; border-color: #5dae98; color: #fff; }
  .lv.N5 { background: var(--n5); } .lv.N4 { background: var(--n4); }
  .lv.N3 { background: #856ea5; } .lv.N2 { background: #e68329; } .lv.N1 { background: #5dae98; }
  /* 小1 こくご（小学一年级国语）：颜色取自原题网站的「正解」绿 */
  .lv.小1 { background: #69bdbc; }
  .chip.on.小1 { background: #69bdbc; border-color: #69bdbc; color: #fff; }
  .sec { font-size: 13px; color: var(--muted); }
  .progress { margin-left: auto; font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .instr { font-size: 13px; color: var(--muted); line-height: 1.9; margin: 0 0 28px; }
  .sentence { font-size: 26px; text-align: center; margin: 8px 0 34px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
  .sentence u { text-decoration: none; border-bottom: 2px solid var(--ink); padding: 0 2px; }
  /* 文章题（layout: 'passage'）：整篇文章全部展开，不做滚动框；□ = 红框空格 */
  .passage { font-size: 17px; line-height: 2.4; text-align: left; white-space: pre-wrap; margin: 0 0 30px;
    padding: 14px 20px; border: 1px solid #ddd8ce; border-radius: 12px; background: #fff; overflow-wrap: anywhere; }
  .passage rt { font-size: 0.55em; }
  .pblank { display: inline-block; min-width: 4.5em; height: 1.5em; line-height: 1.4em; padding: 0 6px; vertical-align: middle;
    border: 2px solid #e05252; border-radius: 3px; text-align: center; white-space: nowrap; }
  .pblank.fill { border-color: #1f9d6b; color: #1f9d6b; font-weight: 600; }
  .pask { font-size: 18px; line-height: 2.3; margin: 0 0 26px; }
  .pask rt { font-size: 0.55em; }
  .asktag { display: inline-block; background: #1d1d1f; color: #fff; font-size: 0.85em; line-height: 1.6; padding: 0 8px; margin-right: 10px; border-radius: 3px; }
  .qimg.big { margin: 0 0 22px; }
  /* 试卷 */
  .exam-sub { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .exam-part { font-size: 14px; font-weight: 600; margin: 4px 0 10px; padding: 8px 14px; border-radius: 10px; background: #e8eefb; color: #2f4f8f; }
  .exam-timer { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; }
  .exam-verdict { margin: 16px 0 0; }
  .exam-no { min-width: 44px; font-weight: 600; font-size: 14px; }
  .exam-no.ok { color: #1f9d6b; }
  .exam-no.bad { color: #d64545; }
  .exam-expl { margin: 0 0 14px 44px; padding: 12px 14px; background: #faf9f6; border-radius: 10px; }
  /* 听力题播放器：只能听一次，进度条只显示不能拖 */
  .aud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 26px; }
  .aud .btn[disabled] { opacity: .45; cursor: default; }
  .abar { flex: 1; min-width: 120px; height: 6px; background: #e6e2da; border-radius: 3px; overflow: hidden; }
  .abar i { display: block; height: 100%; width: 0; background: #1d1d1f; transition: width .25s linear; }
  .atime { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 72px; }
  .anote { width: 100%; font-size: 12px; color: var(--muted); }
  .qimg.big img { max-height: none; border: 1px solid #ddd8ce; }
  .qimg { text-align: center; margin: -14px 0 26px; }
  .qimg img { max-width: 100%; max-height: 240px; border-radius: 10px; background: #fff; }
  rt { font-size: 0.45em; }
  .instr rt { font-size: 0.75em; }
  .instr { line-height: 2.3; }
  .opt rt { font-size: 0.6em; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* 选项是整句（言い換え类）：一行一个，只在空格处断行 */
  .opts.long { grid-template-columns: 1fr; }
  .opts.long .opt { word-break: keep-all; overflow-wrap: anywhere; }
  .opt { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 18px;
         padding: 15px 14px; border-radius: 14px; cursor: pointer; text-align: left; display: flex; gap: 12px;
         align-items: center; transition: border-color .15s, background .15s; }
  .opt:hover:not([disabled]) { border-color: var(--ink); }
  .opt .n { font-size: 13px; color: var(--muted); width: 22px; height: 22px; border-radius: 50%;
            border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .opt[disabled] { cursor: default; }
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.ok .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
  .opt.bad .n { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.dim { opacity: .45; }

  .verdict { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .verdict .dot { width: 10px; height: 10px; border-radius: 50%; }
  .verdict.ok { color: var(--ok); } .verdict.ok .dot { background: var(--ok); }
  .verdict.bad { color: var(--bad); } .verdict.bad .dot { background: var(--bad); }
  .sched { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .expl { font-size: 14.5px; line-height: 1.9; border-top: 1px solid var(--line); padding-top: 14px; }
  .expl p { margin: 0 0 8px; }
  .expl ul { margin: 0 0 8px; padding-left: 20px; }
  .expl .xbox { display: inline-block; border: 1px solid #c9cdd0; padding: 0 3px; line-height: 1.5; margin: 0 1px; }
  .expl .xpink { color: #d63fbf; }
  .expl .xblank { display: inline-block; width: 0.95em; height: 0.95em; border: 2px solid #4ea3dd; box-sizing: border-box;
                  vertical-align: -0.12em; margin: 0 1px; }
  .next { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* 小1 答完后：照原题截图的两栏竖排 —— 左「問題」、右「正解」（2026-11-10，APP_VERSION 10） */
  .orig { display: flex; justify-content: space-between; gap: 16px; margin: 10px 0 18px; overflow-x: auto; }
  .orig > div { flex: none; } .orig .o-head { white-space: nowrap; }
  .orig .o-head { font-size: 13px; font-weight: 700; color: #8a8f94; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .orig .o-head.ok { color: #4fb3b1; }
  .orig .o-head.ok::before { content: ''; width: 12px; height: 12px; border: 3px solid #4fb3b1; border-radius: 50%; }
  .orig .o-v { writing-mode: vertical-rl; height: 400px; font-size: 19px; line-height: 2; letter-spacing: 2px;
               color: #2a2d35; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; align-items: flex-start; position: relative; }
  .orig .o-q { animation: rv-in .4s ease-out both; }
  .orig .o-instr { flex: none; word-break: keep-all; }
  .orig .o-pic { writing-mode: horizontal-tb; flex: none; width: 92px; display: flex; flex-direction: column; align-items: center; }
  .orig .o-pic img { display: block; width: 100%; height: auto; }
  .orig .o-word { writing-mode: vertical-rl; font-size: 40px; line-height: 1.25; margin-top: 10px; letter-spacing: 0; }
  .orig .o-blank, .orig .o-fill { display: inline-block; width: 1.15em; height: 1.15em; border: 2px solid #4ea3dd;
                                  box-sizing: border-box; margin-bottom: 8px; line-height: 1.05; text-align: center; }
  .orig .o-fill { color: #d63fbf; }
  .orig .o-fill b { display: inline-block; font-weight: 400; animation: rv-stamp .55s cubic-bezier(.34, 1.56, .64, 1) .7s both; }
  .orig .o-choices { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .orig .o-lab { font-size: 11px; color: #3c95cf; line-height: 1.4; letter-spacing: 3px; }
  .orig .o-dot { border: 2px dotted #5aaee3; padding: 14px 6px; font-size: 30px; line-height: 1.6; letter-spacing: 8px; }
  .orig .o-frame { border: 2px solid #5aaee3; border-radius: 8px; padding: 16px 12px; box-sizing: border-box;
                   justify-content: flex-start; gap: 10px; }
  .orig .o-a .o-frame { animation: rv-pop .55s cubic-bezier(.34, 1.56, .64, 1) .25s both; }
  .orig .o-a .o-pic img { animation: rv-bob 2.6s ease-in-out 1.4s infinite; }
  .orig.bad .o-a .o-pic { animation: rv-shake .45s ease-in-out 1s; }
  .orig .k-lab { font-size: 11px; color: #3c95cf; letter-spacing: 3px; line-height: 1.4; }
  .orig .k-lab::before { content: '▼'; display: inline-block; margin-bottom: 4px; }
  .orig .k-txt { flex: none; }
  .orig .xbox { display: inline-block; border: 1px solid #c9cdd0; padding: 3px 0; line-height: 1.25; margin: 2px 0; }
  .orig .xpink { color: #d63fbf; }
  .orig .xblank { display: inline-block; width: 0.95em; height: 0.95em; border: 2px solid #4ea3dd; box-sizing: border-box; margin: 2px 0; }
  .orig .spark { position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; opacity: 0;
                 animation: rv-spark .9s ease-out both; }
  @keyframes rv-pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes rv-in { 0% { transform: translateY(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes rv-stamp { 0% { transform: translateY(-50px) scale(1.8); opacity: 0; }
                        60% { transform: translateY(0) scale(.85); opacity: 1; } 100% { transform: none; opacity: 1; } }
  @keyframes rv-bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(1.5deg); } }
  @keyframes rv-shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes rv-spark { 0% { transform: translate(0, 0) scale(.3); opacity: 1; }
                        100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
  .orig .k-head, .orig .k-ans, .orig .k-sp { flex: none; }
  .orig .k-head { display: flex; flex-direction: column; gap: 4px; }
  /* 电脑上：照原题截图一比一 —— 左题目卡片（淡蓝阴影）| 灰竖线 | 右解答蓝框，页面加宽装下两栏 */
  .wrap:has(.orig) { max-width: 1100px; }
  @media (min-width: 700px) {
    .orig { display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: visible; margin: 14px 0 24px; }
    .orig > .o-q { padding-right: 30px; border-right: 5px solid #e9ecec; }
    .orig > .o-a { padding-left: 34px; }
    .orig .o-v { width: 100%; box-sizing: border-box; height: 500px; font-size: 22px; line-height: 1.9; letter-spacing: 3px; gap: 0; justify-content: space-evenly; }
    .orig .o-q .o-v { padding: 30px 20px; box-sizing: border-box; }
    .orig .o-head { font-size: 15px; margin-bottom: 16px; }
    .orig > .o-q, .orig > .o-a { padding-top: 0; }
    .orig .o-pic { width: 112px; }
    .orig .o-word { font-size: 46px; margin-top: 22px; }
    .orig .o-dot { font-size: 36px; padding: 16px 6px; letter-spacing: 10px; }
    .orig .o-lab, .orig .k-lab { font-size: 12px; }
    .orig .o-frame { padding: 22px 16px; border-width: 3px; border-radius: 12px; }
    .orig .k-ans { letter-spacing: 6px; }
  }
  @media (max-width: 480px) {
    .orig { gap: 6px; }
    .orig .o-v { gap: 7px; } .orig .o-head { font-size: 11px; }
    .orig .o-v { height: 330px; font-size: 13px; line-height: 1.9; letter-spacing: 1px; }
    .orig .o-pic { width: 48px; }
    .orig .o-word { font-size: 26px; }
    .orig .o-dot { font-size: 20px; padding: 10px 3px; letter-spacing: 4px; }
    .orig .o-frame { padding: 12px 6px; gap: 6px; }
    .orig .k-lab, .orig .o-lab { font-size: 9px; letter-spacing: 1px; }
  }
  @media (prefers-reduced-motion: reduce) { .orig *, .orig { animation: none !important; } .orig .spark { display: none; } }

  /* 列表 */
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .s { font-size: 16px; }
  .item .s u { text-decoration: none; border-bottom: 1.5px solid var(--ink); }
  .item .m { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; font-size: 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .head h3 { margin: 0; font-size: 16px; }
  .test { background: #fff4d6; color: #7a5a00; font-size: 12px; padding: 8px 12px; border-radius: 10px; margin-bottom: 14px; }

  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .opts { grid-template-columns: 1fr; }
    .sentence { font-size: 22px; }
    .passage { font-size: 16px; padding: 12px 14px; }
    .card { padding: 20px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">日本語 <span>Daily</span></div>
    <div class="hdr-r">
      <div class="date" id="date"></div>
      <button class="upd-btn" id="teachBtn" data-act="teach" title="教学模式：汉字注音 + 外来语原词">注音</button>
      <button class="upd-btn" id="updBtn" data-act="check-update">检查更新</button>
    </div>
  </header>
  <div id="updbar"></div>
  <div id="testbar"></div>
  <nav id="nav">
    <button data-v="home">今日</button>
    <button data-v="wrong">错题集</button>
    <button data-v="all">题库</button>
  </nav>
  <main id="view"></main>
</div>

<script src="questions.js"></script>
<script src="srs.js"></script>
<script>
(function () {
  'use strict';
  var STORE_KEY = 'jp-daily-v1';
  var REMOTE_KEY = 'jp-daily-remote-v1';
  // 改了 index.html / srs.js / install.bat 就把这个数 +1，并把 version.txt 改成同一个数
  var APP_VERSION = 19;
  var GH_API = 'https://api.github.com/repos/mxxs109-ops/japanese-learning-app/contents/';
  var INSTALL_CMD = 'curl -sL -o "%TEMP%\\jla.bat" https://raw.githubusercontent.com/mxxs109-ops/japanese-learning-app/main/install.bat && "%TEMP%\\jla.bat"';

  // ?today=2026-11-20 可模拟日期，用来测试复习排期
  var params = new URLSearchParams(location.search);
  var TODAY = /^\d{4}-\d{2}-\d{2}$/.test(params.get('today') || '') ? params.get('today') : SRS.todayStr();

  // 题库 = 本地 questions.js + 上次从 GitHub 拿到的（同 id 以 GitHub 为准）
  var Q = [], QMAP = {}, PAST = [];
  function validQ(q) {
    return q && typeof q.id === 'string' && typeof q.date === 'string' && typeof q.sentence === 'string' &&
      Array.isArray(q.options) && typeof q.answer === 'number' && Array.isArray(q.explanation);
  }
  var TEACH = {};   // 教学模式注音版，按题目 id
  function mergeQuestions(list, past, teach) {
    (list || []).filter(validQ).forEach(function (q) {
      // 同 id：GitHub 版的字段覆盖本地，但 GitHub 旧缓存里没有的新字段（如 kaisetsu）保留本地的，不被整条盖掉
      if (QMAP[q.id]) { var old = QMAP[q.id]; q = Object.assign({}, old, q); Q[Q.indexOf(old)] = q; } else Q.push(q);
      QMAP[q.id] = q;
    });
    (past || []).forEach(function (p) {
      if (p && p.id && !PAST.some(function (x) { return x.id === p.id && x.date === p.date; })) PAST.push(p);
    });
    if (teach && typeof teach === 'object') Object.keys(teach).forEach(function (id) { TEACH[id] = teach[id]; });
  }
  // 试卷：questions.js 里的 window.EXAMS = [{ id, title, parts: [{ name, ids: [...] }] }]，按原题顺序出题
  var EXAMS = [];
  function mergeExams(list) {
    if (!Array.isArray(list)) return;
    var ok = list.filter(function (x) {
      return x && typeof x.id === 'string' && typeof x.title === 'string' && Array.isArray(x.parts) &&
        x.parts.every(function (p) { return p && typeof p.name === 'string' && Array.isArray(p.ids); });
    });
    if (ok.length) EXAMS = ok;
  }
  mergeQuestions(window.QUESTIONS, window.PAST_RESULTS, window.TEACH);
  mergeExams(window.EXAMS);
  try {
    var cached = JSON.parse(localStorage.getItem(REMOTE_KEY));
    if (cached) { mergeQuestions(cached.questions, cached.past, cached.teach); mergeExams(cached.exams); }
  } catch (e) {}

  var state = load();
  applyPast();
  var view = 'home';
  var session = null;
  var upd = { busy: false, msg: '', newApp: false };

  // 补录微信里已做过的题：每条只写入一次（会覆盖写入前的记录），写过之后不再动
  function applyPast() {
    state.pastApplied = state.pastApplied || {};
    PAST.forEach(function (p) {
      var q = QMAP[p.id], key = p.id + '@' + p.date;
      if (!q || state.pastApplied[key]) return;
      state.records[p.id] = SRS.applyAnswer(null, p.choice === q.answer, p.date, 'daily');
      state.pastApplied[key] = true;
    });
    save();
  }

  // ---------- 检查更新 ----------
  function ghFile(name) {
    return fetch(GH_API + name + '?ref=main', { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
  }
  function checkUpdate(manual) {
    if (upd.busy) return;
    upd.busy = true;
    if (manual) { upd.msg = '正在检查…'; render(); }
    Promise.all([ghFile('questions.js'), ghFile('version.txt').catch(function () { return '0'; })])
      .then(function (res) {
        var box = {};
        new Function('window', res[0])(box);
        var qs = (box.QUESTIONS || []).filter(validQ);
        if (!qs.length) throw new Error('题库读不出来');
        var added = qs.filter(function (q) { return !QMAP[q.id]; }).length;
        mergeQuestions(qs, box.PAST_RESULTS, box.TEACH);
        mergeExams(box.EXAMS);
        try { localStorage.setItem(REMOTE_KEY, JSON.stringify({ questions: qs, past: box.PAST_RESULTS || [], teach: box.TEACH || {}, exams: box.EXAMS || [], at: Date.now() })); } catch (e) {}
        applyPast();
        upd.newApp = (parseInt(res[1], 10) || 0) > APP_VERSION;
        upd.msg = added ? '拿到 ' + added + ' 道新题' : (manual ? '题库已是最新' : '');
      })
      .catch(function (e) { upd.msg = manual ? '检查失败：' + (e && e.message ? e.message : '网络问题') : ''; })
      .then(function () { upd.busy = false; render(); });
  }
  function copyCmd() {
    var done = function () { upd.msg = '已复制：打开 cmd，粘贴，回车'; render(); };
    var fallback = function () { window.prompt('复制这一行，粘进 cmd 回车：', INSTALL_CMD); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(INSTALL_CMD).then(done, fallback);
    else fallback();
  }

  function load() {
    try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.records) return s; } catch (e) {}
    return { records: {} };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { alert('进度没能保存（浏览器禁用了本地存储）'); }
  }
  function rec(id) { return state.records[id] || SRS.blank(); }

  // ---------- 小工具 ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sentenceHTML(s) {
    return esc(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g, function (m, base, rt) {
      // 注音是英文 = 外来语的来源词，换一种样式
      return '<ruby' + (/^[\x20-\x7e]+$/.test(rt) ? ' class="src"' : '') + '>' + base + '<rt>' + rt + '</rt></ruby>';
    }).replace(/\[(.+?)\]/g, '<u>$1</u>');
  }
  // 文章题：sentence 放整篇文章（\n 换行），brief 放列表里显示的那一句（含 □）
  //   老版本不认 layout，会把整篇文章当普通句子显示 —— 内容不丢，只是排版不同
  function isPassage(q) { return q.layout === 'passage'; }
  function blankHTML(s, fill) {
    return sentenceHTML(s).replace(/□/g, fill == null ? '<span class="pblank"></span>'
      : '<span class="pblank fill">' + sentenceHTML(fill) + '</span>')
      .replace(/【しつもん】/g, '<span class="asktag">しつもん</span>');
  }
  // 文章题的题目区：说明 → 文章框 → 插图（原尺寸，不缩小）→ 【しつもん】那句（从文章里拆出来，放在框外，照原题）
  //   老版本不拆，【しつもん】留在文章末尾 —— 内容一样
  function passageHTML(q, ans) {
    var fill = ans != null ? q.options[q.answer] : null;
    var txt = String(tText(q, 'sentence')), k = txt.lastIndexOf('【しつもん】'), body = txt, ask = '';
    if (k > 0) { body = txt.slice(0, k).replace(/\s+$/, ''); ask = txt.slice(k); }
    return '<p class="instr">' + blankHTML(tText(q, 'instruction'), null) + '</p>' +
      '<div class="passage">' + blankHTML(body, fill) + '</div>' +
      imageHTML(q).replace('class="qimg"', 'class="qimg big"') +
      (ask ? '<div class="pask">' + blankHTML(ask, fill) + '</div>' : '');
  }
  // ---------- 听力题（layout: 'listening'）：说明 → 选项图（原尺寸）→ 播放器。只能听一次 ----------
  //   一次 = 同一轮练习里这道题只能点一次播放；播放中、播完都不能再点，进度条不能拖。
  //   本地 audio/ 没有（旧安装）就从 GitHub 读；一声都没放出来就失败的，不算听过，可以再点
  function isListen(q) { return q.layout === 'listening' && typeof q.audio === 'string' && /^audio\/[\w.\-]+$/.test(q.audio); }
  var AUD = null, AUDQ = null;
  function stopAudio() { if (AUD) { try { AUD.pause(); } catch (e) {} } AUD = null; AUDQ = null; }
  function audState(q) { return (session && session.played && session.played[q.id]) || ''; }
  function fmtSec(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2); }
  function audioBlockHTML(q) {
    var st = audState(q), live = AUD && AUDQ === q.id;
    var pct = live && AUD.duration ? Math.min(100, AUD.currentTime / AUD.duration * 100) : (st === 'done' ? 100 : 0);
    var label = st === 'playing' ? '再生中…' : st === 'done' ? '再生済み' : '▶ 再生';
    var note = session && session.audErr === q.id ? '再生できませんでした（ネット接続を確認してください）。もう一度押せます'
      : st === 'done' ? '音声は一回しか聞けません。もう聞き終わりました' : '音声は一回しか聞けません。押すとすぐ始まります';
    return '<div class="aud" id="aud"><button class="btn" data-act="play"' + (st ? ' disabled' : '') + '>' + label + '</button>' +
      '<div class="abar"><i id="abarFill" style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="atime" id="atime">' + (live ? fmtSec(AUD.currentTime) + ' / ' + fmtSec(AUD.duration) : '') + '</span>' +
      '<div class="anote">' + note + '</div></div>';
  }
  function refreshAudio(q) {
    var el = document.getElementById('aud');
    if (el && session && QMAP[session.queue[session.idx]] === q) el.outerHTML = audioBlockHTML(q);
  }
  function playAudio(q) {
    session.played = session.played || {};
    if (session.played[q.id]) return;
    session.played[q.id] = 'playing'; session.audErr = null;
    stopAudio();
    var a = new Audio(), started = false, remoteTried = false;
    var remote = 'https://raw.githubusercontent.com/mxxs109-ops/japanese-learning-app/main/' + q.audio;
    AUD = a; AUDQ = q.id;
    function fail() {
      if (AUD !== a) return;
      if (!started) { delete session.played[q.id]; session.audErr = q.id; }
      else session.played[q.id] = 'done';
      stopAudio(); refreshAudio(q);
    }
    a.addEventListener('playing', function () { started = true; });
    a.addEventListener('timeupdate', function () {
      if (AUD !== a) return;
      var f = document.getElementById('abarFill'), t = document.getElementById('atime');
      if (f && a.duration) f.style.width = Math.min(100, a.currentTime / a.duration * 100).toFixed(1) + '%';
      if (t) t.textContent = fmtSec(a.currentTime) + ' / ' + fmtSec(a.duration);
    });
    a.addEventListener('ended', function () { if (AUD !== a) return; session.played[q.id] = 'done'; stopAudio(); refreshAudio(q); });
    a.addEventListener('error', function () {
      if (AUD !== a) return;
      if (!started && !remoteTried) { remoteTried = true; a.src = remote; a.play().catch(function () {}); }
      else fail();
    });
    a.src = q.audio;
    a.play().catch(function () {});
    refreshAudio(q);
  }
  function listenHTML(q) {
    return '<p class="instr">' + sentenceHTML(tText(q, 'instruction')) + '</p>' +
      imageHTML(q).replace('class="qimg"', 'class="qimg big"') + audioBlockHTML(q);
  }
  function listSentence(q) {
    return ((isPassage(q) || isListen(q)) && typeof q.brief === 'string') ? blankHTML(q.brief, null) : sentenceHTML(tText(q, 'sentence'));
  }
  // 教学模式：有注音版就用注音版，没有就用原文
  function teachOn() { return !!state.teach; }
  function tText(q, field) {
    var t = teachOn() && TEACH[q.id];
    return (t && typeof t[field] === 'string') ? t[field] : q[field];
  }
  function tOption(q, i) {
    var t = teachOn() && TEACH[q.id];
    return (t && Array.isArray(t.options) && typeof t.options[i] === 'string') ? t.options[i] : q.options[i];
  }
  // 解析里的原题标记（照原题「こたえとかいせつ」）：□ = 蓝框空格，〔…〕 = 灰框，〈…〉 = 粉色（填进去的答案）
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/〈([^〈〉]+)〉/g, '<span class="xpink">$1</span>')
      .replace(/〔([^〔〕]+)〕/g, '<span class="xbox">$1</span>')
      .replace(/□/g, '<span class="xblank"></span>');
  }
  function explHTML(lines) {
    var out = '', inList = false;
    lines.forEach(function (l) {
      if (l.indexOf('- ') === 0) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + inline(l.slice(2)) + '</li>'; }
      else { if (inList) { out += '</ul>'; inList = false; } out += '<p>' + inline(l) + '</p>'; }
    });
    return out + (inList ? '</ul>' : '');
  }
  function fmtDate(s) {
    if (!s) return '';
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return (p[1]) + '月' + p[2] + '日 周' + '日一二三四五六'[d.getDay()];
  }
  function daysUntil(s) {
    var a = TODAY.split('-').map(Number), b = s.split('-').map(Number);
    return Math.round((new Date(b[0], b[1] - 1, b[2]) - new Date(a[0], a[1] - 1, a[2])) / 864e5);
  }
  function whenText(s) {
    var n = daysUntil(s);
    if (n <= 0) return '今天';
    if (n === 1) return '明天';
    return fmtDate(s) + '（' + n + ' 天后）';
  }
  function dots(n) {
    var h = '<span class="dots">';
    for (var i = 0; i < SRS.MAX_STREAK; i++) h += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    return h + '</span>';
  }
  function counts() {
    var c = { fresh: 0, due: 0, wrong: 0, done: 0 };
    Q.forEach(function (q) {
      var r = rec(q.id);
      if (q.date <= TODAY && r.status === 'new') c.fresh++;
      if (SRS.isDue(r, TODAY)) c.due++;
      if (r.status === 'learning') c.wrong++;
      if (r.status === 'mastered' || r.status === 'graduated') c.done++;
    });
    return c;
  }

  // ---------- 渲染 ----------
  function render() {
    document.getElementById('date').textContent = fmtDate(TODAY);
    document.getElementById('teachBtn').classList.toggle('on', teachOn());
    var ub = document.getElementById('updBtn');
    ub.disabled = upd.busy; ub.textContent = upd.busy ? '检查中…' : '检查更新';
    document.getElementById('updbar').innerHTML =
      (upd.newApp ? '<div class="upd-card"><div class="t">程序有新版本<small>复制安装命令，粘进 cmd 回车就更新，做题进度不会丢</small></div>' +
        '<button class="btn small" data-act="copy-cmd">复制安装命令</button></div>' : '') +
      (upd.msg ? '<div class="upd-msg">' + esc(upd.msg) + '</div>' : '');
    document.getElementById('testbar').innerHTML = params.get('today')
      ? '<div class="test">测试模式：把今天当作 ' + esc(TODAY) + '（去掉网址里的 ?today=… 回到真实日期）</div>' : '';
    var c = counts();
    var nav = document.getElementById('nav');
    nav.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.v === (session ? '' : view));
    });
    var el = document.getElementById('view');
    if (session) el.innerHTML = quizHTML();
    else if (view === 'wrong') el.innerHTML = wrongHTML();
    else if (view === 'all') el.innerHTML = allHTML();
    else el.innerHTML = homeHTML(c);
  }

  function homeHTML(c) {
    var queue = SRS.dailyQueue(Q, state.records, TODAY);
    var h = '<div class="stats">' +
      '<div class="stat"><b>' + c.fresh + '</b><small>今日新题</small></div>' +
      '<div class="stat"><b>' + c.due + '</b><small>到期复习</small></div>' +
      '<div class="stat"><b>' + c.wrong + '</b><small>错题集</small></div>' +
      '<div class="stat"><b>' + c.done + '</b><small>已掌握</small></div></div>';
    if (queue.length) {
      h += '<div class="card hero"><h2>今天有 ' + queue.length + ' 道题</h2>' +
        '<p>' + (c.due ? c.due + ' 道错题复习 · ' : '') + c.fresh + ' 道新题</p>' +
        '<button class="btn" data-act="start-daily">开始练习</button></div>';
    } else {
      var next = nextEvent();
      h += '<div class="card hero"><h2>今天做完了</h2><p>' +
        (next ? '下一道题：' + whenText(next) : '题库里暂时没有新题') + '</p>' +
        '<button class="btn" data-act="go-all">去题库复习</button></div>';
    }
    return h + examCardsHTML();
  }

  function nextEvent() {
    var best = null;
    Q.forEach(function (q) {
      var r = rec(q.id), d = null;
      if (r.status === 'new' && q.date > TODAY && q.date < '2099') d = q.date;   // 待定的不算「下一道题」
      else if (r.status === 'learning' && r.due > TODAY) d = r.due;
      if (d && (!best || d < best)) best = d;
    });
    return best;
  }

  // 题目插图：先读本地 images/，本地没有（旧安装）就改从 GitHub 读
  function imageHTML(q) {
    if (typeof q.image !== 'string' || !/^images\/[\w.\-]+$/.test(q.image)) return '';
    var remote = 'https://raw.githubusercontent.com/mxxs109-ops/japanese-learning-app/main/' + q.image;
    return '<div class="qimg"><img src="' + esc(q.image) + '" alt="" data-remote="' + esc(remote) + '"' +
      ' onerror="if(this.dataset.remote){this.src=this.dataset.remote;this.dataset.remote=\'\';}else{this.parentNode.style.display=\'none\';}"></div>';
  }

  // 小1：答完后照原题截图显示两栏竖排 —— 左「問題」（题干 / 插图 + □る / せんたくし），右「正解」（こたえと かいせつ）。
  //   只有 小1 + 有插图 + 句子里有 □ 才出现；出任何错返回空 = 页面和以前一样
  function revealHTML(q, ok) {
    try {
      if (q.level !== '小1' || !imageHTML(q) || String(q.sentence).indexOf('□') < 0) return '';
      var img = imageHTML(q).replace('<div class="qimg">', '').replace(/<\/div>$/, '');
      var k = q.kaisetsu || {};
      var ans = esc(q.options[q.answer]);
      var sparks = '';
      if (ok) {
        var colors = ['#69bdbc', '#d63fbf', '#f2b134', '#4ea3dd'];
        for (var i = 0; i < 12; i++) {
          var a = i / 12 * Math.PI * 2, d = 40 + (i % 3) * 16;
          sparks += '<i class="spark" style="right:50%;top:62%;background:' + colors[i % 4] +
            ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) +
            'px;animation-delay:' + (0.95 + (i % 3) * 0.05).toFixed(2) + 's"></i>';
        }
      }
      var left = '<div class="o-q"><div class="o-head">問題（もんだい）</div><div class="o-v">' +
        '<div class="o-instr">' + inline(q.instruction) + '</div>' +
        '<div class="o-pic">' + img + '<div class="o-word">' + esc(q.sentence).replace('□', '<span class="o-blank"></span>') + '</div></div>' +
        '<div class="o-choices"><div class="o-lab">せんたくし</div><div class="o-dot">' +
        q.options.map(esc).join('・') + '</div></div></div></div>';
      var right = '<div class="o-a"><div class="o-head ok">正解（せいかい）</div><div class="o-v o-frame">' +
        '<div class="k-head"><div class="k-lab">こたえと　かいせつ</div>' +
        '<div class="k-ans">こたえ…' + esc(k.answer || q.options[q.answer]) + '</div></div>' +
        '<div class="o-pic">' + img + '<div class="o-word">' +
        esc(q.sentence).replace('□', '<span class="o-fill"><b>' + ans + '</b></span>') + '</div></div>' +
        (typeof k.text === 'string' ? '<div class="k-txt">' + inline(k.text) + '</div>' : '') +
        '<i class="k-sp"></i>' + sparks + '</div></div>';
      return '<div class="orig' + (ok ? '' : ' bad') + '">' + left + right + '</div>';
    } catch (e) { return ''; }
  }

  // ---------- 试卷 ----------
  function examIds(ex) { var a = []; ex.parts.forEach(function (p) { a = a.concat(p.ids); }); return a; }
  function examReady(ex) { return examIds(ex).every(function (id) { return QMAP[id]; }); }
  function examCardsHTML() {
    var h = '';
    EXAMS.forEach(function (ex) {
      if (!examReady(ex)) return;
      var n = examIds(ex).length, last = state.exams && state.exams[ex.id];
      h += '<div class="card exam-card"><div class="head"><h3>' + esc(ex.title) + '</h3>' +
        '<button class="btn" data-act="start-exam" data-id="' + esc(ex.id) + '">开始</button></div>' +
        '<p class="exam-sub">' + n + ' 题 · ' + ex.parts.map(function (p) { return esc(p.name) + ' ' + p.ids.length; }).join(' / ') +
        ' · 按原题顺序 · 每题答完马上看对错，不能改 · 计时不限时</p>' +
        (last ? '<p class="exam-sub">上次：' + fmtDate(last.date) + ' · ' + last.score + ' / ' + last.total +
          (last.ms ? ' · 用时 ' + fmtDur(last.ms) : '') + '</p>' : '') + '</div>';
    });
    return h;
  }
  function examPartOf(ex, id) {
    for (var k = 0; k < ex.parts.length; k++) if (ex.parts[k].ids.indexOf(id) >= 0) return k;
    return -1;
  }
  // rid 有值 = 交卷后回看某一题：照答题时的样子显示题目 + 自己选的答案 + 解析，按钮回成绩页
  function examHTML(rid) {
    var s = session, ex = s.exam, review = rid != null;
    var id = review ? rid : s.queue[s.idx], q = QMAP[id], ans = review ? s.picks[id] : s.answer;
    var no = review ? s.queue.indexOf(id) : s.idx;
    var k = examPartOf(ex, id), part = ex.parts[k], first = part && part.ids[0] === id;
    var h = ((first || review) && part ? '<div class="exam-part">第 ' + (k + 1) + ' 部分 · ' + esc(part.name) + '</div>' : '') +
      '<div class="card"><div class="qtop"><span class="lv ' + esc(q.level) + '">' + esc(q.level) + '</span>' +
      '<span class="sec">' + esc(q.section) + '</span>' +
      '<span class="exam-timer" id="exTimer">⏱ ' + fmtDur(examElapsed()) + '</span>' +
      '<span class="progress">第 ' + (no + 1) + ' 题 / 共 ' + s.queue.length + ' 题</span></div>' +
      (isListen(q) ? listenHTML(q) : isPassage(q) ? passageHTML(q, ans)
        : '<p class="instr">' + sentenceHTML(tText(q, 'instruction')) + '</p>' +
          '<div class="sentence">' + sentenceHTML(tText(q, 'sentence')) + '</div>' + imageHTML(q)) +
      '<div class="opts' + (q.options.some(function (o) { return String(o).length > 10; }) ? ' long' : '') + '">';
    q.options.forEach(function (o, i) {
      var cls = ans == null ? '' : i === q.answer ? ' ok' : (i === ans ? ' bad' : ' dim');
      h += '<button class="opt' + cls + '" data-act="pick" data-i="' + i + '"' + (ans != null ? ' disabled' : '') + '>' +
        '<span class="n">' + (i + 1) + '</span><span>' + sentenceHTML(tOption(q, i)) + '</span></button>';
    });
    h += '</div>';
    if (ans != null) {
      var ok = ans === q.answer;
      h += '<div class="verdict ' + (ok ? 'ok' : 'bad') + ' exam-verdict"><span class="dot"></span>' +
        (ok ? '正确' : '错误 · 正确答案是 ' + (q.answer + 1) + ' ' + sentenceHTML(q.options[q.answer])) + '</div>' +
        (review ? '<div class="expl">' + explHTML(q.explanation) + '</div>' +
          '<div class="next"><button class="btn" data-act="exam-back">返回成绩</button></div>'
        : '<div class="next"><button class="btn" data-act="exam-next">' + (s.idx + 1 < s.queue.length ? '下一题' : '交卷') + '</button></div>');
    }
    return h + '</div>';
  }
  // 计时：从开始算，不限时；交卷时停
  function examElapsed() { var s = session; return s ? (s.end || Date.now()) - s.start : 0; }
  function fmtDur(ms) {
    var t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, x = t % 60;
    return (h ? h + ':' + ('0' + m).slice(-2) : m) + ':' + ('0' + x).slice(-2);
  }
  setInterval(function () {
    if (!session || session.mode !== 'exam' || session.end) return;
    var el = document.getElementById('exTimer');
    if (el) el.textContent = '⏱ ' + fmtDur(examElapsed());
  }, 1000);
  // 选了就定：马上记分、显示对错，不能改（照官网样题）
  function examPick(i) {
    var s = session, id = s.queue[s.idx], q = QMAP[id], ok = i === q.answer;
    if (s.answer != null) return;
    s.answer = i; s.picks[id] = i; s.results.push(ok);
    // 试卷按「手动练习」记：做对不计连对；做错照样进错题集（和题库「练」一样）
    state.records[id] = SRS.applyAnswer(state.records[id], ok, TODAY, 'free');
    save(); render();
  }
  function examResultHTML() {
    var s = session, ex = s.exam, score = 0, total = s.queue.length;
    var rows = '', partScore = ex.parts.map(function () { return 0; });
    s.queue.forEach(function (id, n) {
      var q = QMAP[id], p = s.picks[id], ok = p === q.answer, k = examPartOf(ex, id);
      if (ok) { score++; partScore[k]++; }
      rows += '<div class="item" id="exrow-' + n + '"><span class="exam-no' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + ' ' + (n + 1) + '</span>' +
        '<div class="main"><div class="s">' + esc(q.section) + '</div>' +
        '<div class="m">你的答案 ' + (p + 1) + (ok ? '' : ' · 正确答案 ' + (q.answer + 1)) + '</div></div>' +
        '<button class="btn ghost small" data-act="exam-view" data-id="' + esc(id) + '">看解析</button></div>';
    });
    return '<div class="card hero"><h2>' + score + ' / ' + total + '</h2><p>' + esc(ex.title) + ' · 用时 ' + fmtDur(examElapsed()) + '</p>' +
      '<p>' + ex.parts.map(function (p, k) { return esc(p.name) + ' ' + partScore[k] + ' / ' + p.ids.length; }).join('　') + '</p>' +
      '<button class="btn" data-act="end">返回</button></div>' +
      '<div class="card"><div class="head"><h3>每道题</h3></div>' + rows + '</div>';
  }
  function startExam(ex) {
    if (!ex || !examReady(ex)) return;
    stopAudio();
    session = { queue: examIds(ex), idx: 0, mode: 'exam', exam: ex, answer: null, after: null, results: [], picks: {}, open: {},
      start: Date.now(), end: 0 };
    render(); window.scrollTo(0, 0);
  }
  function examNext() {
    var s = session;
    if (s.answer == null) return;
    stopAudio();
    s.idx++; s.answer = null;
    if (s.idx >= s.queue.length) {
      s.end = Date.now();
      state.exams = state.exams || {};
      state.exams[s.exam.id] = { date: TODAY, score: s.results.filter(Boolean).length, total: s.queue.length, ms: s.end - s.start };
      save();
    }
    render(); window.scrollTo(0, 0);
  }

  function quizHTML() {
    var s = session;
    if (s.mode === 'exam') return s.idx < s.queue.length ? examHTML() : s.review && QMAP[s.review] ? examHTML(s.review) : examResultHTML();
    if (s.idx >= s.queue.length) return summaryHTML();
    var q = QMAP[s.queue[s.idx]], r = rec(q.id), ans = s.answer;
    var tag = r.status === 'learning' ? '<span class="tag bad">错题 ' + r.streak + '/' + SRS.MAX_STREAK + '</span>'
      : r.status === 'new' ? '<span class="tag">新题</span>' : '';
    if (ans != null) tag = '';
    // 小1 答完后：原来的题干/插图换成原题样式的两栏（左 問題 / 右 正解），选项按钮留在最下面
    var orig = ans != null ? revealHTML(q, ans === q.answer) : '';
    var h = '<div class="card"><div class="qtop"><span class="lv ' + esc(q.level) + '">' + esc(q.level) + '</span>' +
      '<span class="sec">' + esc(q.section) + '</span>' + tag +
      '<span class="progress">' + (s.idx + 1) + ' / ' + s.queue.length + '</span></div>' +
      (orig || (isListen(q) ? listenHTML(q) : isPassage(q)
        ? passageHTML(q, ans)
        : '<p class="instr">' + sentenceHTML(tText(q, 'instruction')) + '</p>' +
          '<div class="sentence">' + sentenceHTML(tText(q, 'sentence')) + '</div>' + imageHTML(q))) +
      '<div class="opts' + (q.options.some(function (o) { return String(o).length > 10; }) ? ' long' : '') + '">';
    q.options.forEach(function (o, i) {
      var cls = '';
      if (ans != null) cls = i === q.answer ? 'ok' : (i === ans ? 'bad' : 'dim');
      h += '<button class="opt ' + cls + '" data-act="pick" data-i="' + i + '"' + (ans != null ? ' disabled' : '') + '>' +
        '<span class="n">' + (i + 1) + '</span><span>' + sentenceHTML(tOption(q, i)) + '</span></button>';
    });
    h += '</div></div>';
    if (ans != null) {
      var ok = ans === q.answer;
      h += '<div class="card"><div class="verdict ' + (ok ? 'ok' : 'bad') + '"><span class="dot"></span>' +
        (ok ? '正确' : '错误 · 正确答案是 ' + (q.answer + 1) + ' ' + sentenceHTML(q.options[q.answer])) + '</div>' +
        '<div class="sched">' + schedText(s.after) + '</div>' +
        '<div class="expl">' + explHTML(q.explanation) + '</div>' +
        '<div class="next"><button class="btn" data-act="next">' + (s.idx + 1 < s.queue.length ? '下一题' : '完成') + '</button></div></div>';
    }
    return h;
  }

  function schedText(r) {
    if (r.status === 'mastered') return '已掌握，不会再出现';
    if (r.status === 'graduated') return '连对 10 次，已移出错题集 🎉';
    if (r.status === 'learning') return dots(r.streak) + '连对 ' + r.streak + '/' + SRS.MAX_STREAK + ' · 下次出现：' + whenText(r.due);
    return '';
  }

  function summaryHTML() {
    var s = session, right = s.results.filter(Boolean).length;
    return '<div class="card hero"><h2>' + right + ' / ' + s.results.length + ' 正确</h2>' +
      '<p>' + (right === s.results.length ? '全对，漂亮。' : '做错的已放进错题集，下星期见。') + '</p>' +
      '<button class="btn" data-act="end">返回</button></div>';
  }

  function wrongHTML() {
    var list = Q.filter(function (q) { return rec(q.id).status === 'learning'; })
      .sort(function (a, b) { return rec(a.id).due < rec(b.id).due ? -1 : 1; });
    var h = '<div class="card"><div class="head"><h3>错题集 · ' + list.length + '</h3>' +
      (list.length ? '<button class="btn" data-act="free-wrong">练习</button>' : '') + '</div>';
    if (!list.length) return h + '<div class="empty">还没有错题</div></div>';
    list.forEach(function (q) {
      var r = rec(q.id);
      h += '<div class="item"><span class="lv ' + esc(q.level) + '">' + esc(q.level) + '</span><div class="main">' +
        '<div class="s">' + listSentence(q) + '</div>' +
        '<div class="m">' + dots(r.streak) + r.streak + '/' + SRS.MAX_STREAK + ' · 答案 ' + sentenceHTML(q.options[q.answer]) +
        ' · 错过 ' + r.wrongCount + ' 次 · 下次 ' + whenText(r.due) + '</div></div>' +
        '<button class="btn ghost small" data-act="free-one" data-id="' + esc(q.id) + '">练</button></div>';
    });
    return h + '</div>';
  }

  // 题库级别筛选（可多选；空 = 全部）。只管题库列表和「复习」，不影响「今日」
  var LEVELS = ['小1', 'N5', 'N4', 'N3', 'N2', 'N1'];
  function levelOK(q) { var L = state.levels || []; return !L.length || L.indexOf(q.level) >= 0; }
  function chipsHTML() {
    var L = state.levels || [];
    var h = '<div class="chips"><button class="chip' + (L.length ? '' : ' on') + '" data-act="lv" data-lv="ALL">全部</button>';
    LEVELS.forEach(function (lv) {
      h += '<button class="chip ' + lv + (L.indexOf(lv) >= 0 ? ' on' : '') + '" data-act="lv" data-lv="' + lv + '">' + lv + '</button>';
    });
    return h + '</div>';
  }

  function allHTML() {
    var shown = Q.filter(levelOK);
    var reviewable = shown.filter(function (q) { return q.date <= TODAY; });
    var h = '<div class="card"><div class="head"><h3>题库 · ' + shown.length + '</h3>' +
      (reviewable.length ? '<button class="btn" data-act="free-done">复习</button>' : '') + '</div>' + chipsHTML();
    if (!shown.length) return h + '<div class="empty">这个级别还没有题</div></div>';
    shown.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (q) {
      var r = rec(q.id), locked = q.date > TODAY, st;
      if (locked) st = q.date >= '2099' ? '解锁日期待定' : whenText(q.date) + '解锁';   // 2099-12-31 = 先锁着、哪天放还没定
      else st = { 'new': '未做', learning: '错题 ' + r.streak + '/' + SRS.MAX_STREAK, mastered: '已掌握', graduated: '已毕业' }[r.status];
      h += '<div class="item"' + (locked ? ' style="opacity:.5"' : '') + '><span class="lv ' + esc(q.level) + '">' + esc(q.level) + '</span>' +
        '<div class="main"><div class="s">' + (locked ? '🔒 ' + esc(q.section) : listSentence(q)) + '</div>' +
        '<div class="m">' + (q.date >= '2099' ? '' : fmtDate(q.date) + ' · ') + st + '</div></div>' +
        (locked ? '' : '<button class="btn ghost small" data-act="free-one" data-id="' + esc(q.id) + '">练</button>') + '</div>';
    });
    return h + '</div>';
  }

  // ---------- 操作 ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function startSession(ids, mode) {
    if (!ids.length) return;
    session = { queue: ids, idx: 0, mode: mode, answer: null, after: null, results: [] };
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-v]');
    if (!t) return;
    if (t.dataset.v) { stopAudio(); session = null; view = t.dataset.v; render(); return; }
    var act = t.dataset.act;
    if (act === 'start-daily') startSession(SRS.dailyQueue(Q, state.records, TODAY), 'daily');
    else if (act === 'go-all') { view = 'all'; render(); }
    else if (act === 'free-one') startSession([t.dataset.id], 'free');
    else if (act === 'free-wrong') startSession(Q.filter(function (q) { return rec(q.id).status === 'learning'; }).map(function (q) { return q.id; }), 'free');
    else if (act === 'free-done') startSession(shuffle(Q.filter(function (q) { return q.date <= TODAY && levelOK(q); }).map(function (q) { return q.id; })), 'free');
    else if (act === 'lv') {
      var lv = t.dataset.lv, L = (state.levels || []).slice(), i = L.indexOf(lv);
      if (lv === 'ALL') L = [];
      else if (i >= 0) L.splice(i, 1);
      else if (LEVELS.indexOf(lv) >= 0) L.push(lv);
      if (L.length === LEVELS.length) L = [];   // 全部选上 = 全部
      state.levels = L; save(); render();
    }
    else if (act === 'start-exam') startExam(EXAMS.filter(function (x) { return x.id === t.dataset.id; })[0]);
    else if (act === 'pick' && session && session.mode === 'exam') examPick(Number(t.dataset.i));
    else if (act === 'exam-next' && session && session.mode === 'exam' && session.answer != null) examNext();
    else if (act === 'exam-view' && session && session.mode === 'exam') { stopAudio(); session.review = t.dataset.id; render(); window.scrollTo(0, 0); }
    else if (act === 'exam-back' && session && session.mode === 'exam') {
      var backNo = session.queue.indexOf(session.review);
      stopAudio(); session.review = null; render();
      var row = document.getElementById('exrow-' + backNo);
      if (row) row.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
    }
    else if (act === 'pick' && session && session.answer == null) {
      var q = QMAP[session.queue[session.idx]], i = Number(t.dataset.i), ok = i === q.answer;
      // 今日练习里，只有"到期"的错题和新题按 daily 计；其他按手动复习计
      var r0 = rec(q.id), mode = session.mode === 'daily' && (r0.status === 'new' || SRS.isDue(r0, TODAY)) ? 'daily' : 'free';
      state.records[q.id] = SRS.applyAnswer(state.records[q.id], ok, TODAY, mode);
      save();
      session.answer = i; session.after = state.records[q.id]; session.results.push(ok);
      render();
    }
    else if (act === 'play' && session) { var pq = QMAP[session.queue[session.idx]]; if (pq && isListen(pq)) playAudio(pq); }
    else if (act === 'next') { stopAudio(); session.idx++; session.answer = null; session.after = null; render(); window.scrollTo(0, 0); }
    else if (act === 'end') { stopAudio(); session = null; view = 'home'; render(); }
    else if (act === 'check-update') checkUpdate(true);
    else if (act === 'teach') { state.teach = !state.teach; save(); render(); }
    else if (act === 'copy-cmd') copyCmd();
  });

  render();
  checkUpdate(false);   // 打开时静默检查一次：有新题就直接出现；没网就当没发生
})();
</script>
</body>
</html>
